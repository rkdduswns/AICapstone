<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>강써치 페이지 연결</title>
<link rel="stylesheet" href="popup.css">
<body>
  <h1>현재 페이지 연결</h1>
  <p>허용한 사이트는 제목과 주소를 현재 작업에 자동 연결합니다.</p>
  <label>Backend 포트 <input id="port" type="number" min="1" max="65535" value="8765"></label>
  <label>연결 토큰 <input id="token" type="password" autocomplete="off"></label>
  <button id="save">연결 설정 저장</button>
  <button id="site" disabled>사이트 확인 중</button>
  <details><summary>수동 연결 옵션</summary>
    <button id="capture">현재 페이지 본문까지 연결</button>
  </details>
  <p id="status" role="status" aria-live="polite"></p>
  <script type="module" src="popup.mjs"></script>
</body>
</html>
