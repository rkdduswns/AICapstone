name: Windows validation
on:
  push:
    branches: [main, chore/phase1-preparation]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '${{ matrix.python }}'
      - run: python -m pip install -e ".[dev]"
      - run: python -m pip check
      - run: python -m ruff check src tests tools
      - run: python -m pytest -q --junitxml=windows-results.xml
      - name: Record environment
        if: always()
        run: |
          python --version
          Get-ComputerInfo | Select-Object WindowsProductName, WindowsVersion, OsBuildNumber
          python -m pip freeze
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-results-python-${{ matrix.python }}
          path: windows-results.xml
