[project]
name = "contexttrace"
version = "0.1.0"
description = "Windows 작업 로그 기반 개인 지식 출처 역추적 시스템"
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.8,<7",
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.27,<1", "ruff>=0.9,<1"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["client*", "backend*", "shared*"]
namespaces = false

[tool.pytest.ini_options]
testpaths = ["tests"]
# 학습용 test_*.py도 프로젝트 테스트로 수집하지 않는다.
addopts = "--import-mode=importlib --ignore=etc/study"

[tool.ruff]
# 학습 사본은 파일 경로를 직접 전달해도 검사에서 제외한다.
extend-exclude = ["etc/study"]
force-exclude = true
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
